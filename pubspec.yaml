name: general_theme_studio
description: Professional Flutter studio for creating and exporting FUTO Keyboard themes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # File Operations
  file_picker: 8.1.7
  archive: ^3.6.1
  image: ^4.3.0

  # Network (Google Fonts)
  http: ^1.2.2
  dio: ^5.7.0

  # UI Enhancements
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.5.1
  share_plus: ^10.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/shapes/
    - assets/previews/
    - assets/svg_shapes/
