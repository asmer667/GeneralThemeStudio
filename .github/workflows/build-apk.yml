name: Build General Theme Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Backup original files
        run: |
          cp lib/main.dart /tmp/main.dart.original
          cp pubspec.yaml /tmp/pubspec.yaml.original
          echo "✅ Backup done"

      - name: Generate android/ folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.generalthemestudio --project-name general_theme_studio --overwrite .
          fi

      - name: Restore original files
        run: |
          cp /tmp/main.dart.original lib/main.dart
          cp /tmp/pubspec.yaml.original pubspec.yaml
          echo "✅ Files restored"

      - name: Fix compileSdk to 34
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdk [0-9]\+/compileSdk 34/g' android/app/build.gradle
          fi
          if [ -f "android/gradle.properties" ]; then
            cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: general-theme-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit android/ back
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add android/ || true
          git diff --staged --quiet || git commit -m "Auto-generate android/ [skip ci]"
          git push || true
