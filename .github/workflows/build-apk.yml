name: Build General Theme Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Backup original files
        run: |
          cp lib/main.dart /tmp/main.dart.original
          cp pubspec.yaml /tmp/pubspec.yaml.original
          echo "✅ Backup done"

      - name: Generate android/ folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.generalthemestudio --project-name general_theme_studio --overwrite .
          fi

      - name: Restore original files
        run: |
          cp /tmp/main.dart.original lib/main.dart
          cp /tmp/pubspec.yaml.original pubspec.yaml
          echo "✅ Files restored"

      - name: Fix compileSdk to 34
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdk [0-9]\+/compileSdk 34/g' android/app/build.gradle
          fi
          if [ -f "android/gradle.properties" ]; then
            cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          fi

      - name: Fix Flutter 3.24.5 compatibility
        run: |
          echo "🔧 Fixing withValues → withOpacity..."
          find lib -name "*.dart" -type f -exec sed -i \
            -e 's/\.withValues(alpha: \([^)]*\))/.withOpacity(\1)/g' \
            -e 's/\.withValues(alpha:\([^)]*\))/.withOpacity(\1)/g' \
            {} +

          echo "🔧 Fixing Color .r .g .b → .red .green .blue..."
          find lib -name "*.dart" -type f -exec sed -i \
            -e 's/\.r \* 255/.red * 255/g' \
            -e 's/\.g \* 255/.green * 255/g' \
            -e 's/\.b \* 255/.blue * 255/g' \
            -e 's/color\.r)/color.red)/g' \
            -e 's/color\.g)/color.green)/g' \
            -e 's/color\.b)/color.blue)/g' \
            {} +

          echo "🔧 Fixing final a.r / a.g / a.b..."
          sed -i 's/final dr = (a.r - b.r).abs();/final dr = (a.red - b.red).abs();/g' lib/utils/color_utils.dart
          sed -i 's/final dg = (a.g - b.g).abs();/final dg = (a.green - b.green).abs();/g' lib/utils/color_utils.dart
          sed -i 's/final db = (a.b - b.b).abs();/final db = (a.blue - b.blue).abs();/g' lib/utils/color_utils.dart

          echo "✅ Conversion done"
          echo "Checking for remaining issues..."
          grep -rn "withValues\|\.r \*\|\.g \*\|\.b \*" lib/ || echo "✅ Clean"

      - name: Fix wallpaper_api.dart cast issue
        run: |
          echo "🔧 Fixing Future.cast issue in wallpaper_api.dart..."
          python3 << 'PYEOF'
          import re

          file_path = 'lib/services/wallpaper_api.dart'
          with open(file_path, 'r') as f:
              content = f.read()

          # ابحث عن النمط الخاطئ
          old_pattern = '''final files = await dir
              .list()
              .where((e) {
                if (e is! File) return false;
                final ext = e.path.split('.').last.toLowerCase();
                return ['png', 'jpg', 'jpeg', 'webp'].contains(ext);
              })
              .toList()
              .cast<File>()
              .toList();'''

          new_pattern = '''final entities = await dir.list().toList();
          final files = entities
              .whereType<File>()
              .where((e) {
                final ext = e.path.split('.').last.toLowerCase();
                return ['png', 'jpg', 'jpeg', 'webp'].contains(ext);
              })
              .toList();'''

          content = content.replace(old_pattern, new_pattern)

          # نمط بديل إن اختلف
          content = re.sub(
              r'\.toList\(\)\s*\.cast<File>\(\)\s*\.toList\(\)',
              '.whereType<File>().toList()',
              content
          )

          with open(file_path, 'w') as f:
              f.write(content)

          print("✅ wallpaper_api.dart fixed")
          PYEOF

      - name: Fix downloads folder
        run: |
          echo "🔧 Checking other cast issues..."
          grep -rn "\.cast<File>" lib/ || echo "✅ No cast issues"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: general-theme-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit android/ back
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add android/ || true
          git diff --staged --quiet || git commit -m "Auto-generate android/ [skip ci]"
          git push || true
